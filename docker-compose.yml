services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: incident-monitoring-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-otlp-receiver
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.144.0
    container_name: incident-monitoring-otel-collector
    command:
      - --config=/etc/otelcol-contrib/config.yml
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./monitoring/otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data: